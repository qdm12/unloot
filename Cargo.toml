[package]
name = "unloot"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
chrono = "0.4"
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "suggestions", "color", "string", "error-context"] }
csv = "1.4"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif"] }
kamadak-exif = "0.6.1"
libc = "0.2"
rayon = "1.12.0"
regex = { version = "1.13.1", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "smallvec", "fmt"] }
ureq = { version = "3.4.2", default-features = false, features = ["json", "rustls"] }

[dev-dependencies]
tempfile = "3"
